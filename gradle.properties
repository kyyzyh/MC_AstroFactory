# ---------------------------------------------------------------------------
# Gradle 运行时配置
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# 模组 / 平台版本
# ---------------------------------------------------------------------------
minecraft_version=26.3
neo_version=26.3.0.113
minecraft_version_range=[26.3,26.4)
neo_version_range=[26.3.0.113,)

# ---------------------------------------------------------------------------
# 模组元数据
# ---------------------------------------------------------------------------
mod_id=astrofactory
mod_name=AstroFactory
mod_version=0.1.0
mod_group_id=com.xiaoyi.astrofactory
mod_authors=zyh18
mod_license=MIT
mod_description=An AstroFactory-style automation mod: continuous conveyor belts, robotic arms, assembling machines and a research tree.

# ---------------------------------------------------------------------------
# 本机已有 JDK（避免 Gradle 联网下载 toolchain）
# ---------------------------------------------------------------------------
org.gradle.java.installations.paths=E:/AI Work/XiaoYi/MC Mod/jdk-25.0.5+8,E:/AI Work/XiaoYi/MC Mod/jdk-21.0.13+9
org.gradle.java.installations.auto-download=false

# ---------------------------------------------------------------------------
# 构建产物自动同步目标（HMCL 实际加载的游戏 mods 目录）
# 留空则跳过。换机器/换启动器时改这一行即可。
# ---------------------------------------------------------------------------
game_mods_dir=E:/Game/MC/.minecraft/versions/26.3-NeoForge/mods
