plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // 打印 NFRT 详细日志，便于定位下载卡点
    neoFormRuntime {
        verbose = true
    }

    // 26.x 线：官方 MDK 目前不含 mappings 配置块，使用默认官方映射

    runs {
        client {
            client()
            gameDirectory = file('run')
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // 本地镜像仓库：存放从国内镜像（腾讯云）预先下载的大构件。
    // 官方 maven.neoforged.net 在本机只有 ~16KB/s，大 jar 必然下载中断。
    maven { url = uri("${rootDir}/local-maven") }
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

// 把 gradle.properties 里的 ${...} 展开进 neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}
