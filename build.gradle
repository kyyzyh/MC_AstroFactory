plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // 打印 NFRT 详细日志，便于定位下载卡点
    neoFormRuntime {
        verbose = true
    }

    // 26.x 线：官方 MDK 目前不含 mappings 配置块，使用默认官方映射

    runs {
        client {
            client()
            gameDirectory = file('run')
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // 本地镜像仓库：存放从国内镜像（腾讯云）预先下载的大构件。
    // 官方 maven.neoforged.net 在本机只有 ~16KB/s，大 jar 必然下载中断。
    maven { url = uri("${rootDir}/local-maven") }
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }

    // ------------------------------------------------------------------
    // 第三方模组库仓库（均已在 26.3 上实测可拉取，见 docs/third-party-26.3.md）
    // ------------------------------------------------------------------
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.shedaniel.me/' }        // Cloth Config / REI
    maven { url = 'https://maven.blamejared.com/' }      // JEI
    maven { url = 'https://maven.theillusivec4.top/' }   // Curios
}

// ---------------------------------------------------------------------------
// 第三方库版本（全部为 26.3 / NeoForge 官方发布版，勿在未验证的情况下升级）
// ---------------------------------------------------------------------------
ext {
    clothConfigVersion  = '26.3.159'
    yaclVersion         = '3.9.7+26.3-neoforge'
    jadeVersion         = '26.3.5+neoforge'
    jeiVersion          = '31.18.0.118'
    reiVersion          = '26.3.824'
    curiosVersion       = '17.0.1+26.3'
    geckolibVersionId   = '2s1O42FX'   // Modrinth version id（对应 26.3-5.5.7）
}

dependencies {
    // 说明：目前这些库只完成「依赖坐标打通 + 构建验证」，尚未有功能代码调用它们。
    // 因此统一用 compileOnly —— 不打包、不强制运行时安装，玩家没装也不会崩。
    // 等真正接入某个功能时，再按需把对应库改成 implementation。

    // 配置界面（Cloth Config；YACL 为已查证可用的备选，见 ext.yaclVersion）
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${clothConfigVersion}"

    // 准星信息 HUD（Jade）
    compileOnly "maven.modrinth:jade:${jadeVersion}"

    // 配方查看器（JEI / REI）—— 只引 API 包，运行时由玩家自行安装本体
    compileOnly "mezz.jei:jei-26.3-neoforge-api:${jeiVersion}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${reiVersion}"

    // 饰品槽（Curios）
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curiosVersion}"

    // 带动画实体（GeckoLib）—— 26.3-5.5.7 已确认存在，但当前无动画实体，
    // 且 Modrinth Maven 的坐标版本是 version id 而非版本号，接入时再启用：
    // compileOnly "maven.modrinth:geckolib:${geckolibVersionId}"
}

// 把 gradle.properties 里的 ${...} 展开进 neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------------------
// 资源校验：Gradle 打包不校验 JSON 内容，语法错会一路带到游戏里
// （真实事故：lang 少一个逗号 → 整个语言文件被丢弃 → 界面回落成英文）
// ---------------------------------------------------------------------------
def jsonSourceDir = file('src/main/resources')

tasks.register('validateJson') {
    description = '校验 src/main/resources 下所有 .json 的语法'
    group = 'verification'

    def scanDir = jsonSourceDir
    inputs.dir(scanDir)
    outputs.upToDateWhen { false }   // 每次都查，成本很低（毫秒级）

    doLast {
        def errors = []
        def count = 0
        scanDir.eachFileRecurse { f ->
            if (!f.isFile() || !f.name.endsWith('.json')) {
                return
            }
            count++
            try {
                new groovy.json.JsonSlurper().parseText(f.getText('UTF-8'))
            } catch (Exception e) {
                errors << "  ${f.absolutePath.replace(scanDir.absolutePath + File.separator, '')}\n    -> ${e.message}"
            }
        }
        if (!errors.isEmpty()) {
            throw new GradleException(
                    "JSON 语法错误 ${errors.size()} 处（共检查 ${count} 个文件）：\n" + errors.join('\n'))
        }
        logger.lifecycle("JSON 校验通过：${count} 个文件")
    }
}

tasks.named('check').configure {
    dependsOn 'validateJson'
}

// ---------------------------------------------------------------------------
// 构建产物自动同步
//   build 成功后 → 复制 jar 到游戏 mods 目录 + dist/ + ../McMod/
//   目标路径在 gradle.properties 的 game_mods_dir 里配置；
//   目录不存在时跳过（换机器构建不会报错）。
// ---------------------------------------------------------------------------
def jarFile = tasks.named('jar').flatMap { it.archiveFile }
def syncTargets = [
        'game' : providers.gradleProperty('game_mods_dir').getOrElse(''),
        'dist' : file('dist').absolutePath,
        'McMod': file('../MC/McMod').absolutePath,
]

tasks.register('syncJar') {
    description = '把构建产物同步到游戏 mods 目录、dist/ 与 ../McMod/'
    group = 'distribution'
    dependsOn tasks.named('jar')

    def archive = jarFile
    def targets = syncTargets
    def modIdPrefix = mod_id + '-'

    doLast {
        def src = archive.get().asFile
        if (!src.exists()) {
            throw new GradleException("找不到构建产物：${src}")
        }
        targets.each { name, dirPath ->
            if (!dirPath) {
                logger.lifecycle("[sync] 跳过 ${name}：未配置路径")
                return
            }
            def dir = new File(dirPath)
            if (!dir.parentFile?.exists()) {
                logger.lifecycle("[sync] 跳过 ${name}：父目录不存在 ${dir}")
                return
            }
            dir.mkdirs()
            // 清掉旧版本同名 jar，否则两个 jar 同 modId 会启动即崩
            dir.listFiles()?.each { f ->
                if (f.isFile() && f.name.startsWith(modIdPrefix) && f.name.endsWith('.jar')
                        && f.name != src.name) {
                    f.delete()
                    logger.lifecycle("[sync] 移除旧版本 ${name}/${f.name}")
                }
            }
            def dest = new File(dir, src.name)
            dest.bytes = src.bytes
            logger.lifecycle("[sync] ${name} <- ${dest.absolutePath} (${src.length()} bytes)")
        }
    }
}

tasks.named('build').configure {
    finalizedBy 'syncJar'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}
